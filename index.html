    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #6366f1;
            --text: #ffffff;
        }
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .syne { font-family: 'Syne', sans-serif; }
        
        @keyframes grid-drift {
            0% {
                background-position: 0px 0px;
            }
            100% {
                background-position: 40px 40px;
            }
        }

        @keyframes orb-float-1 {
            0%, 100% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            33% {
                transform: translate3d(6vw, 8vh, 0) scale(1.12);
            }
            66% {
                transform: translate3d(-4vw, 14vh, 0) scale(0.94);
            }
        }

        @keyframes orb-float-2 {
            0%, 100% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            50% {
                transform: translate3d(-8vw, -10vh, 0) scale(1.15);
            }
        }

        @keyframes beam-scan {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }
            20% {
                opacity: 0.5;
            }
            80% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .grid-bg {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
            animation: grid-drift 3.5s linear infinite;
        }

        .motion-orb-indigo {
            animation: orb-float-1 16s ease-in-out infinite;
            will-change: transform;
        }

        .motion-orb-secondary {
            animation: orb-float-2 20s ease-in-out infinite;
            will-change: transform;
        }

        .motion-beam {
            animation: beam-scan 10s linear infinite;
            will-change: transform, opacity;
        }

        @media (prefers-reduced-motion: reduce) {
            .grid-bg, .motion-orb-indigo, .motion-orb-secondary, .motion-beam {
                animation: none !important;
            }
        }

        .indie-card {
            background: #111;
            border: 1px solid #222;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .indie-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        .gradient-heading {
            background: linear-gradient(to right, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .custom-cursor {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
        }
    </style>
